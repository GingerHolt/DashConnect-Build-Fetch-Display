<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel the World</title>
  <link rel="stylesheet" href="styles.css"><!-- Link to main CSS file -->
</head>
<body>
  <!-- Main container -->
  <main class="container">
    <h1>Travel the World</h1><!-- Main heading -->
    
    <!-- Travel section to show random locations -->
    <section class="card travel">
      <h2>Where in the world do you want to go?</h2>
      <div class="row centered-buttons">
        <!-- Buttons to show random location and another random location -->
        <button id="randomLocBtn">Show Random Location</button>
        <button id="randomLocAgainBtn">Another</button>
      </div>
        <!-- Result container for random location -->
      <div id="randomLocResult" class="result">
        <div id="randomLocLoading" style="display:none">Loading…</div>
        <a id="randomLocLink" href="#" target="_blank" style="display:none">
          <img id="randomLocImg" src="" alt="Random location" style="max-width:100%;height:auto;margin-top:8px;display:block">
        </a>
        <div id="randomLocAddress" style="margin-top:8px"></div>
        <div id="randomLocAttr" style="margin-top:6px;font-size:0.9em;color:#555"></div>
      </div>
    </section><!-- End travel section -->

    <!-- Temperature conversion section -->
    <section class="card">
      <!-- Embedded four-seasons SVG (primary, guaranteed to display) -->
      <svg id="convertHeaderImg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" preserveAspectRatio="xMidYMid slice" style="width:100%;max-width:900px;max-height:240px;height:auto;display:block;margin:0 auto;object-fit:cover;margin-bottom:8px;">
        <defs>
          <style>
            .label { font-family: Arial, sans-serif; font-size:28px; font-weight:700 }
          </style>
        </defs>
        <rect width="225" height="240" x="0" y="0" fill="#7fc97f"/>
        <rect width="225" height="240" x="225" y="0" fill="#ffd92f"/>
        <rect width="225" height="240" x="450" y="0" fill="#fd8d3c"/>
        <rect width="225" height="240" x="675" y="0" fill="#80b1d3"/>
        <text x="112.5" y="130" text-anchor="middle" fill="#ffffff" class="label">Spring</text>
        <text x="337.5" y="130" text-anchor="middle" fill="#333333" class="label">Summer</text>
        <text x="562.5" y="130" text-anchor="middle" fill="#ffffff" class="label">Autumn</text>
        <text x="787.5" y="130" text-anchor="middle" fill="#ffffff" class="label">Winter</text>
      </svg>
      <!--End Embedded four-seasons SVG -->
      
      <!-- Temperature conversion UI -->
      <!-- status element removed -->
      <h2>Look ahead at the weather before you pack.  
        You may need to convert the temperature. (C → F)</h2>
        <!-- Temperature input and convert button -->
        <div class="row">
        <input id="celsius" type="number" placeholder="Celsius" step="any">
        <button id="convertBtn">Convert</button>
      </div>
      <!-- Result container for temperature conversion -->
      <div id="convertResult" class="result"></div>
    </section>
    <!-- End temperature conversion section -->

    <!-- Metric to Standard conversion section -->
    <section class="card">
      <!-- Embedded metric→standard header graphic -->
      <svg id="metricHeaderImg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" preserveAspectRatio="xMidYMid meet" style="width:90%;max-width:700px;max-height:140px;height:auto;display:block;margin-left:auto;margin-right:auto;margin-bottom:8px;">
        <defs>
          <style>.label{font-family:Arial, sans-serif;font-size:20px;font-weight:700}</style>
        </defs>
        <rect width="900" height="140" fill="#f4f6f8"/>
        <g transform="translate(18,16)">
          <rect width="120" height="108" rx="8" fill="#e8f5e9"/>
          <text x="60" y="62" text-anchor="middle" fill="#2e7d32" class="label">m → ft</text>
        </g>
        <g transform="translate(180,16)">
          <rect width="120" height="108" rx="8" fill="#fff3e0"/>
          <text x="60" y="62" text-anchor="middle" fill="#ef6c00" class="label">km → mi</text>
        </g>
        <g transform="translate(342,16)">
          <rect width="120" height="108" rx="8" fill="#e3f2fd"/>
          <text x="60" y="62" text-anchor="middle" fill="#0277bd" class="label">cm → in</text>
        </g>
        <g transform="translate(504,16)">
          <rect width="120" height="108" rx="8" fill="#fce4ec"/>
          <text x="60" y="62" text-anchor="middle" fill="#ad1457" class="label">kg → lb</text>
        </g>
        <g transform="translate(666,16)">
          <rect width="120" height="108" rx="8" fill="#f3e5f5"/>
          <text x="60" y="62" text-anchor="middle" fill="#6a1b9a" class="label">l → gal</text>
        </g>
      </svg>
      <!-- End embedded metric→standard header graphic -->

      <!-- Metric to Standard conversion UI -->
      <h2>Not every place uses the same units of measurement.  
        You may need to convert units. (Metric → Standard)</h2>
      <!-- Metric to Standard input and convert button -->
        <div class="row">
        <input id="metricValue" type="number" placeholder="Value" step="any">
        <!-- Dropdown for metric type -->
        <select id="metricType">
          <option value="m_to_ft">Meters → Feet</option>
          <option value="km_to_mi">Kilometers → Miles</option>
          <option value="cm_to_in">Centimeters → Inches</option>
          <option value="kg_to_lb">Kilograms → Pounds</option>
          <option value="g_to_oz">Grams → Ounces</option>
          <option value="l_to_gal">Liters → Gallons (US)</option>
        </select>
        <!-- Convert button -->
        <button id="convertMetricBtn">Convert</button>
      </div>
      <!-- Result container for Metric to Standard conversion -->
      <div id="metricResult" class="result"></div>
    </section>
    <!-- End metric to standard conversion section -->

    <footer class="foot"></footer>
  </main>
  <!-- End main container -->

  <!-- Link to main JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
